# VMware emulated HD Audio
#
# Output: coarse DMA position counter breaks timer scheduling -> period wakeups.
# Input: period wakeups never fire on the emulated capture path, so keep the
# default (timer) scheduling for capture, which does deliver samples.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.disable-batch  = true
        api.alsa.period-size    = 2048
        api.alsa.period-num     = 8
        api.alsa.headroom       = 32768
      }
    }
  }
]
