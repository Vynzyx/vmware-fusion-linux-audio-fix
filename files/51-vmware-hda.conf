# VMware emulated HD Audio
#
# The emulated controller has a coarse DMA position counter and delays
# completion interrupts, so PipeWire's timer-based scheduling reports phantom
# underruns and re-prepares the stream about once a second.
#
# Period-wakeup scheduling, batched IO, long periods and a wide ring keep the
# codec fed without relying on its position counter.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.disable-batch  = true
        api.alsa.period-size    = 4096
        api.alsa.period-num     = 8
        api.alsa.headroom       = 16384
      }
    }
  }
]
