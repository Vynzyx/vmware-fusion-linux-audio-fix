# Long graph cycles for the emulated audio card.
# Must stay >= api.alsa.period-size in 51-vmware-hda.conf, otherwise PipeWire
# clamps the period back down to the quantum.

context.properties = {
  default.clock.quantum = 4096
  default.clock.min-quantum = 1024
  default.clock.max-quantum = 8192
}
