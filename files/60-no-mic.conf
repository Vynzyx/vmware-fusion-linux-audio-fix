# Emulated capture node. Loaded only when the microphone is not wanted;
# without it, apps pick the codec's input and record silence.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
